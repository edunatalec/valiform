name: valiform
description: >
  Schema-driven Flutter forms on top of Validart. Typed VField<T>,
  ValueNotifier-based reactive state, sync + async cross-field validation.
version: 3.1.0
repository: https://github.com/edunatalec/valiform

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  validart: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

topics:
  - form
  - validation
  - flutter
  - form-validation
